spring:
  application:
    name: reminder

  profiles:
    active: dev

  jackson:
    time-zone: UTC

  datasource:
    url: jdbc:h2:mem:reminderdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    com.bong.reminder: DEBUG
