spring:
  application:
    name: reminder

  profiles:
    active: dev

  jackson:
    time-zone: UTC

app:
  cors:
    # 쉼표 구분 패턴 — 인증/쿠키 도입 시 환경별로 override.
    allowed-origin-patterns: http://localhost:3000

---
spring:
  config:
    activate:
      on-profile: dev

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.bong.reminder: DEBUG

---
spring:
  config:
    activate:
      on-profile: test

  h2:
    console:
      enabled: false

  jpa:
    show-sql: false

logging:
  level:
    com.bong.reminder: INFO
    org.hibernate.SQL: WARN
